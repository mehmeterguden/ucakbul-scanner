name: scan

# Madrid'den ~95 şehir grubuna hedef pencereler için gidiş/dönüş fiyatlarını tarar (fli = Google Flights).
# Her pencere kendi iş akışı (window.yml): 8 shard paralel, bitince pencere ayrı ayrı yayınlanır (bir pencere hazır olunca görürsün).
on:
  schedule:
    - cron: '5 */3 * * *'
  workflow_dispatch:
    inputs:
      window:
        description: 'Sadece bu pencere (örn. 2026-11-13); boşsa hepsi'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  w1:
    if: ${{ github.event.inputs.window == '' || github.event.inputs.window == '2026-11-13' || github.event_name == 'schedule' }}
    uses: ./.github/workflows/window.yml
    with:
      window: '2026-11-13'
  w2:
    if: ${{ github.event.inputs.window == '' || github.event.inputs.window == '2026-11-20' || github.event_name == 'schedule' }}
    uses: ./.github/workflows/window.yml
    with:
      window: '2026-11-20'
  w3:
    if: ${{ github.event.inputs.window == '' || github.event.inputs.window == '2026-11-27' || github.event_name == 'schedule' }}
    uses: ./.github/workflows/window.yml
    with:
      window: '2026-11-27'
  w4:
    if: ${{ github.event.inputs.window == '' || github.event.inputs.window == '2026-12-04' || github.event_name == 'schedule' }}
    uses: ./.github/workflows/window.yml
    with:
      window: '2026-12-04'
  w5:
    if: ${{ github.event.inputs.window == '' || github.event.inputs.window == '2026-12-11' || github.event_name == 'schedule' }}
    uses: ./.github/workflows/window.yml
    with:
      window: '2026-12-11'
